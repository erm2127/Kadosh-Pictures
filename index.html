.icon{width:35px;height:35px;border-radius:10px;display:grid;place-items:center;background:#fff;color:#111;font-weight:bold;font-size:15px}
.label{flex:1;text-align:left;font-weight:700;letter-spacing:.3px}

.footer{margin-top:23px;color:#777;font-size:11px;letter-spacing:1.4px}
